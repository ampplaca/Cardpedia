<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardpedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #121016;
    --surface: #1c1922;
    --surface-2: #241f2c;
    --line: rgba(240,236,226,0.08);
    --line-strong: rgba(240,236,226,0.16);
    --text: #f0ece2;
    --text-dim: #a89fae;
    --text-faint: #6f6779;
    --gold: #c9a869;
    --gold-dim: rgba(201,168,105,0.16);

    --el-fire: #e8623d;
    --el-water: #3d8fe8;
    --el-grass: #5fa855;
    --el-electric: #d9c23a;
    --el-ice: #6fc6d9;
    --el-ground: #a87c4f;
    --el-air: #8fd1c8;
    --el-light: #e8d99a;
    --el-dark: #8a5fb0;
    --el-normal: #9a94a3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  ::selection { background: var(--gold-dim); color: var(--text); }

  a { color: inherit; }

  /* ---------- Layout shell ---------- */
  .shell {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
    align-content: start;
  }

  .shell.no-rail {
    grid-template-columns: 1fr;
  }
  .shell.no-rail .rail {
    display: none;
  }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
  }

  /* ---------- Header ---------- */
  .sticky-top {
    grid-column: 1 / -1;
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--bg);
  }

  header.top {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 22px 28px 18px;
    border-bottom: 1px solid var(--line);
  }

  header.top h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.01em;
    margin: 0;
  }

  header.top .count {
    font-size: 13px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  header.top .spacer { flex: 1; }

  .auth-area {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .auth-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 7px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .auth-btn:hover { background: var(--gold-dim); }

  .auth-user {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .auth-user .email { color: var(--text); font-weight: 500; }

  .signout-btn {
    background: none;
    border: 1px solid var(--line-strong);
    color: var(--text-faint);
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  .signout-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* ---------- Auth modal ---------- */
  .auth-modal {
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    max-width: 380px;
    width: 100%;
    padding: 26px 26px 24px;
  }

  .auth-modal h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .auth-modal .sub {
    font-size: 13px;
    color: var(--text-faint);
    margin-bottom: 20px;
  }

  .auth-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .auth-tab {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    padding: 7px 4px;
    margin-right: 18px;
    color: var(--text-faint);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .auth-tab.active { color: var(--text); border-bottom-color: var(--gold); }

  .field-label {
    font-size: 12px;
    color: var(--text-dim);
    display: block;
    margin: 14px 0 6px;
  }

  .auth-modal input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
  }
  .auth-modal input:focus { border-color: var(--gold); }

  .auth-submit {
    width: 100%;
    margin-top: 20px;
    background: var(--gold);
    border: none;
    color: #1a1610;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 11px;
    border-radius: 7px;
    cursor: pointer;
  }
  .auth-submit:hover { opacity: 0.9; }
  .auth-submit:disabled { opacity: 0.5; cursor: default; }

  .auth-message {
    margin-top: 14px;
    font-size: 12.5px;
    padding: 9px 11px;
    border-radius: 7px;
    line-height: 1.4;
  }
  .auth-message.error { background: rgba(232,98,61,0.12); color: #e8623d; }
  .auth-message.success { background: rgba(95,168,85,0.12); color: #5fa855; }

  /* ---------- Filter rail ---------- */
  .rail {
    border-right: 1px solid var(--line);
    padding: 22px 20px 40px;
    position: sticky;
    top: var(--sticky-h, 110px);
    align-self: start;
    max-height: calc(100vh - var(--sticky-h, 110px));
    overflow-y: auto;
  }

  @media (max-width: 860px) {
    .rail {
      position: static;
      max-height: none;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
  }

  .search-box {
    position: relative;
    margin-bottom: 26px;
  }

  .search-box input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .search-box input:focus { border-color: var(--gold); }
  .search-box input::placeholder { color: var(--text-faint); }

  .filter-group {
    margin-bottom: 24px;
  }

  .filter-group h3 {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    margin: 0 0 10px;
    letter-spacing: 0.02em;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.12s ease;
    user-select: none;
  }

  .chip:hover { border-color: var(--gold); color: var(--text); }

  .chip.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #1a1610;
    font-weight: 600;
  }

  select.series-select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 9px 12px;
    outline: none;
  }

  .mini-search {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    padding: 7px 9px;
    outline: none;
    margin-bottom: 8px;
  }
  .mini-search:focus { border-color: var(--gold); }

  .series-checklist {
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 0;
  }

  .series-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    font-size: 12.5px;
    color: var(--text-dim);
    cursor: pointer;
  }
  .series-row:hover { background: var(--surface-2); }
  .series-row input { accent-color: var(--gold); width: 14px; height: 14px; flex-shrink: 0; }
  .series-row.checked { color: var(--text); }

  .series-selected-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
  }

  .series-chip {
    font-size: 11px;
    background: var(--gold-dim);
    color: var(--gold);
    padding: 3px 8px 3px 10px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .series-chip button {
    background: none;
    border: none;
    color: var(--gold);
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 0;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }

  .toggle-row input { accent-color: var(--gold); width: 15px; height: 15px; }

  .clear-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 12.5px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
    margin-top: 4px;
  }
  .clear-btn:hover { color: var(--gold); }

  /* ---------- Main content ---------- */
  main {
    padding: 22px 28px 60px;
    min-width: 0;
  }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 14px 28px 0;
    border-bottom: 1px solid var(--line);
  }

  .tab {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    padding: 9px 18px;
    color: var(--text-faint);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    letter-spacing: 0.01em;
  }

  .tab.active {
    color: var(--text);
    border-bottom-color: var(--gold);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 16px;
  }

  .card-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

  .card-tile:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
  }

  .card-tile .art-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    background: var(--surface-2);
    overflow: hidden;
  }

  .card-tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .iconic-badge {
    position: absolute;
    top: 7px;
    right: 7px;
    background: rgba(18,16,22,0.82);
    color: var(--gold);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
    letter-spacing: 0.03em;
    border: 1px solid var(--gold-dim);
  }

  .element-badge {
    position: absolute;
    bottom: 7px;
    left: 7px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 5px;
    color: #14121a;
    letter-spacing: 0.02em;
  }

  .card-tile .info {
    padding: 10px 11px 12px;
  }

  .card-tile .name {
    font-family: 'Oswald', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.2;
    margin: 0 0 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-tile .series {
    font-size: 11.5px;
    color: var(--text-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-tile .talent {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .skin-count-badge {
    display: inline-block;
    margin-top: 5px;
    font-size: 10.5px;
    color: var(--gold);
    background: var(--gold-dim);
    padding: 1px 7px;
    border-radius: 5px;
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-faint);
  }

  .empty-state h2 {
    font-family: 'Oswald', sans-serif;
    color: var(--text-dim);
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-faint);
    font-size: 14px;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10,9,13,0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    max-width: 780px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 2;
  }

  .modal-header h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .modal-header .sub {
    font-size: 13px;
    color: var(--text-faint);
  }

  .modal-close {
    background: none;
    border: 1px solid var(--line-strong);
    color: var(--text-dim);
    width: 30px;
    height: 30px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    flex-shrink: 0;
  }
  .modal-close:hover { border-color: var(--gold); color: var(--gold); }

  .modal-body {
    padding: 20px 24px 28px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 24px;
  }

  @media (max-width: 600px) {
    .modal-body { grid-template-columns: 1fr; }
  }

  .modal-art {
    position: relative;
  }

  .modal-art img {
    width: 100%;
    border-radius: 10px;
    display: block;
    cursor: zoom-in;
  }

  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
    color: #14121a;
  }

  .tag.neutral {
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--line-strong);
  }

  .skins-section h3 {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-dim);
    margin: 22px 0 10px;
  }

  .skin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 10px;
  }

  .skin-thumb {
    text-align: center;
  }

  .skin-thumb img {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    border-radius: 7px;
    border: 1px solid var(--line);
    display: block;
    margin-bottom: 5px;
    cursor: zoom-in;
  }

  .skin-thumb.legendary img { border-color: var(--gold); }
  .skin-thumb.mythical img { border-color: #d95fc4; }

  .skin-thumb .sname {
    font-size: 10.5px;
    color: var(--text-dim);
    line-height: 1.25;
  }

  .rarity-pill {
    display: inline-block;
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 4px;
    margin-top: 3px;
  }
  .rarity-pill.event { background: var(--surface-2); color: var(--text-faint); }
  .rarity-pill.legendary { background: var(--gold-dim); color: var(--gold); }
  .rarity-pill.mythical { background: rgba(217,95,196,0.16); color: #d95fc4; }

  .no-skins {
    color: var(--text-faint);
    font-size: 13px;
    font-style: italic;
  }

  /* ---------- Wishlist heart ---------- */
  .skin-thumb { position: relative; }

  .wishlist-heart {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(18,16,22,0.75);
    border: none;
    color: rgba(240,236,226,0.7);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  .wishlist-heart:hover { color: var(--gold); }
  .wishlist-heart.wanted { color: var(--gold); }
  .wishlist-heart.obtained { color: #5fa855; }

  .card-heart {
    top: 7px;
    left: 7px;
    right: auto;
    width: 24px;
    height: 24px;
    font-size: 13px;
  }

  .modal-art-heart {
    position: absolute;
    top: 8px;
    left: 8px;
  }

  /* ---------- Calculator ---------- */
  .calc-shell {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    max-width: 920px;
  }

  @media (max-width: 760px) {
    .calc-shell { grid-template-columns: 1fr; }
  }

  .calc-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 22px;
  }

  .calc-panel h3 {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 16px;
    color: var(--text-dim);
  }

  .calc-field { margin-bottom: 14px; }

  .calc-field label {
    display: block;
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 5px;
  }

  .calc-field select, .calc-field input[type="text"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 9px 11px;
    outline: none;
  }
  .calc-field select:focus, .calc-field input:focus { border-color: var(--gold); }

  .calc-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-dim);
    margin-top: 8px;
    cursor: pointer;
  }
  .calc-toggle input { accent-color: var(--gold); width: 15px; height: 15px; }

  .calc-card-preview {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding: 8px;
    background: var(--surface-2);
    border-radius: 8px;
  }
  .calc-card-preview img {
    width: 40px;
    height: 53px;
    object-fit: cover;
    border-radius: 5px;
  }
  .calc-card-preview .cname {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
  }
  .calc-card-preview .cel {
    font-size: 11.5px;
    color: var(--text-faint);
  }

  .calc-results {
    grid-column: 1 / -1;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    padding: 22px 24px;
  }

  .calc-results h3 {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 16px;
  }

  .cost-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }

  .cost-item {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 13px;
  }

  .cost-item .clabel {
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 3px;
  }

  .cost-item .cval {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }

  .calc-note {
    font-size: 12.5px;
    color: var(--text-faint);
    line-height: 1.5;
    margin-top: 6px;
  }

  .calc-warning {
    background: rgba(232,98,61,0.1);
    color: #e8623d;
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 12.5px;
    margin-bottom: 14px;
  }

  .sacrifice-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .sacrifice-pill {
    background: var(--gold-dim);
    color: var(--gold);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 11px;
    border-radius: 999px;
  }

  /* ---------- Teams ---------- */
  .teams-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .new-team-btn {
    background: var(--gold);
    border: none;
    color: #1a1610;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    padding: 9px 18px;

// Teams-only: -1 represents "don't have the card at all yet," a step before Exotic.

const UNOBTAINED = -1;
function milestoneLabel(idx) {
  return idx === UNOBTAINED ? 'Unobtained' : (MILESTONES[idx]?.shortLabel || '');
}

let calcState = {
  cardId: '',

};

// Approximate trading-market prices in Cores to acquire a card outright, based on
// rarity and Iconic status. These are typical/estimated prices (stated as such by
// the community), not a fixed game mechanic — shown as ranges where given.
const ACQUISITION_BASE_CORES = {
  Exotic:    { normal: [2, 2],   iconic: [6, 6] },
  Legendary: { normal: [7, 8],   iconic: [15, 15] }
};

// Grade adds to that base acquisition price. No community data yet for S/S+.
const GRADE_ACQUISITION_ADDON_CORES = {
  D: [0, 0], C: [0, 0], B: [1, 1], A: [4, 6], S: null, 'S+': null
};

function getAcquisitionEstimate(rarity, isIconic, grade) {
  const base = ACQUISITION_BASE_CORES[rarity]?.[isIconic ? 'iconic' : 'normal'];
  if (!base) return null;
  const addon = GRADE_ACQUISITION_ADDON_CORES[grade];
  const addonKnown = !!addon;
  const [aMin, aMax] = addon || [0, 0];
  return { min: base[0] + aMin, max: base[1] + aMax, gradeDataMissing: !addonKnown };
}

function renderAuthArea() {
  const area = document.getElementById('authArea');
  if (currentSession) {
    const displayName = currentProfile ? currentProfile.username : currentSession.user.email;
    area.innerHTML = `
      <div class="auth-user">
        <span class="email">${displayName}</span>
        <button class="signout-btn" id="editProfileBtn">Edit profile</button>
        <button class="signout-btn" id="signOutBtn">Sign out</button>
      </div>
    `;
    document.getElementById('signOutBtn').onclick = async () => {
      await sb.auth.signOut();
    };
    document.getElementById('editProfileBtn').onclick = openProfileModal;
  } else {
    area.innerHTML = `<button class="auth-btn" id="signInBtn">Sign in</button>`;
    document.getElementById('signInBtn').onclick = openAuthModal;
  }
}

function openProfileModal() {
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
    <div class="modal-backdrop" id="profileBackdrop">
      <div class="auth-modal">
        <h2>Edit Profile</h2>
        <p class="sub">Signed in as ${currentSession.user.email}</p>
        <form id="profileForm">
          <label class="field-label">Username</label>
          <input type="text" id="editUsername" value="${currentProfile ? currentProfile.username : ''}" autocomplete="username" placeholder="3-20 letters, numbers, underscores">
          <button type="submit" class="auth-submit" id="profileSaveBtn">Save</button>
        </form>
        <div id="profileMessage"></div>
      </div>
    </div>
  `;

  document.getElementById('profileBackdrop').onclick = (e) => {
    if (e.target.id === 'profileBackdrop') closeModal();
  };

  document.getElementById('profileForm').onsubmit = async (e) => {
    e.preventDefault();
    const newUsername = document.getElementById('editUsername').value.trim();
    const msgBox = document.getElementById('profileMessage');
    const saveBtn = document.getElementById('profileSaveBtn');
    msgBox.innerHTML = '';

    if (!/^[a-zA-Z0-9_]{3,20}$/.test(newUsername)) {
      msgBox.innerHTML = '<div class="auth-message error">Username must be 3-20 characters: letters, numbers, and underscores only.</div>';
      return;
    }

    if (currentProfile && newUsername === currentProfile.username) {
      closeModal();
      return;
    }

    saveBtn.disabled = true;
    // Upsert rather than update — if this account somehow never got a profiles row
    // (e.g. the signup trigger didn't fire), this creates it instead of failing.
    const { data, error } = await sb.from('profiles')
      .upsert({ id: currentSession.user.id, username: newUsername }, { onConflict: 'id' })
      .select()
      .single();

    if (error) {
      msgBox.innerHTML = /duplicate|unique/i.test(error.message)
        ? '<div class="auth-message error">That username is already taken — try another.</div>'
        : `<div class="auth-message error">${error.message}</div>`;
      saveBtn.disabled = false;
      return;
    }

    currentProfile = data;
    renderAuthArea();
    closeModal();
  };
}

async function loadProfile() {
  if (!currentSession) { currentProfile = null; return; }
  const { data, error } = await sb.from('profiles').select('*').eq('id', currentSession.user.id).single();
  if (error) { currentProfile = null; return; }

function openAuthModal() {
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
    <div class="modal-backdrop" id="authBackdrop">
      <div class="auth-modal">
        <h2>Track your own progress</h2>
        <p class="sub">Sign in to save your skin wishlist across devices.</p>
        <div class="auth-tabs">
          <div class="auth-tab active" data-mode="signin">Sign In</div>
          <div class="auth-tab" data-mode="signup">Sign Up</div>
        </div>
        <form id="authForm">
          <div id="usernameField" style="display:none;">
            <label class="field-label">Username</label>
            <input type="text" id="authUsername" autocomplete="username" placeholder="3-20 letters, numbers, underscores">
          </div>
          <label class="field-label">Email</label>
          <input type="email" id="authEmail" required autocomplete="email">
          <label class="field-label">Password</label>
          <input type="password" id="authPassword" required autocomplete="current-password" minlength="6">
          <button type="submit" class="auth-submit" id="authSubmitBtn">Sign In</button>
        </form>
        <div id="authMessage"></div>
      </div>
    </div>
  `;

  let mode = 'signin';
  const submitBtn = document.getElementById('authSubmitBtn');
  const usernameField = document.getElementById('usernameField');
  const usernameInput = document.getElementById('authUsername');

  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.onclick = () => {
      mode = tab.dataset.mode;
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t === tab));
      submitBtn.textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
      usernameField.style.display = mode === 'signup' ? 'block' : 'none';
      usernameInput.required = mode === 'signup';
      document.getElementById('authMessage').innerHTML = '';
    };
  });

  document.getElementById('authBackdrop').onclick = (e) => {
    if (e.target.id === 'authBackdrop') closeModal();
  };

  document.getElementById('authForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const username = usernameInput.value.trim();
    const msgBox = document.getElementById('authMessage');
    submitBtn.disabled = true;
    msgBox.innerHTML = '';

    try {
      if (mode === 'signin') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        closeModal();
      } else {
        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
          throw new Error('Username must be 3-20 characters: letters, numbers, and underscores only.');
        }
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username } } });
        if (error) {
          if (/duplicate|already registered|unique/i.test(error.message)) {
            throw new Error(/profiles|username/i.test(error.message)
              ? 'That username is already taken — try another.'
              : 'That email is already registered — try signing in instead.');
          }
          throw error;
        }
        if (data.session) {
          closeModal();
        } else {
          msgBox.innerHTML = '<div class="auth-message success">Account created — check your email to confirm, then sign in.</div>';
        }
      }
    } catch (err) {
      msgBox.innerHTML = `<div class="auth-message error">${err.message}</div>`;
    } finally {
      submitBtn.disabled = false;
    }
  };
}

}

// Cycles a skin through: untracked -> wanted -> obtained -> untracked.
// Returns true if the modal should re-render to reflect the change.
async function cycleWishlist(skinId) {
  if (!currentSession) { openAuthModal(); return false; }

  const existing = wishlistBySkinId[skinId];

  if (existing && existing.wanted && existing.obtained) {
    const { error } = await sb.from('user_skin_wishlist')
      .delete().eq('user_id', currentSession.user.id).eq('skin_id', skinId);
    if (error) { console.error(error); return false; }
    delete wishlistBySkinId[skinId];
    return true;
  }

  const payload = {
    user_id: currentSession.user.id,
    skin_id: skinId,
    wanted: true,
    obtained: !!(existing && existing.wanted),
    updated_at: new Date().toISOString()
  };

  const { data, error } = await sb.from('user_skin_wishlist')
    .upsert(payload, { onConflict: 'user_id,skin_id' })
    .select()
    .single();

  if (error) { console.error(error); return false; }
  wishlistBySkinId[skinId] = data;
  return true;
}

// Supabase's REST API caps a single request at 1000 rows by default. Cards (1,974)
// and skins (1,465) both exceed that, so we page through in batches until a page
// comes back short (meaning we've reached the end).
async function fetchAllRows(table, orderCol) {
  const pageSize = 1000;
  let allRows = [];
  let from = 0;
  while (true) {
    let query = sb.from(table).select('*');
    if (orderCol) query = query.order(orderCol);
    query = query.range(from, from + pageSize - 1);
    const { data, error } = await query;
    if (error) return { data: null, error };
    allRows = allRows.concat(data || []);
    if (!data || data.length < pageSize) break;
    from += pageSize;
  }
  return { data: allRows, error: null };
}

async function loadData() {
  const [cardsRes, skinsRes, stagesRes, gradesRes, capsRes, regradeRes, attuneRes] = await Promise.all([
    fetchAllRows('cards', 'name'),
    fetchAllRows('skins'),
    sb.from('build_stage_templates').select('*').order('stage_order'),
    sb.from('grade_tiers').select('*').order('tier_order'),
    sb.from('rarity_grade_caps').select('*'),
    sb.from('regrade_config').select('*').single(),
    sb.from('attunement_config').select('*').single()
  ]);

  if (cardsRes.error) {
    document.getElementById('content').innerHTML =
      '<div class="empty-state"><h2>Could not load cards</h2><p>' + cardsRes.error.message + '</p></div>';
    return;
  }

  allCards = cardsRes.data || [];
  allSkins = skinsRes.data || [];
  buildStages = stagesRes.data || [];
  gradeTiers = gradesRes.data || [];
  (capsRes.data || []).forEach(c => { rarityGradeCaps[c.rarity] = c; });
  regradeConfig = regradeRes.data || null;
  attunementConfig = attuneRes.data || null;

  skinsByCardId = {};
  allSkins.forEach(s => {
    if (!s.card_id) return;
    if (!skinsByCardId[s.card_id]) skinsByCardId[s.card_id] = [];
    skinsByCardId[s.card_id].push(s);
  });

  buildFilters();
  render();
}

function buildFilters() {
  allSeries = [...new Set(allCards.map(c => c.series))].sort();
  seriesCounts = {};
  allCards.forEach(c => { seriesCounts[c.series] = (seriesCounts[c.series] || 0) + 1; });
  renderSeriesChecklist();

  document.getElementById('seriesSearchBox').addEventListener('input', (e) => {
    seriesSearchTerm = e.target.value;
    renderSeriesChecklist();
  });

  const elementSet = [...new Set(allCards.map(c => c.element).filter(Boolean))].sort();
  const elementChips = document.getElementById('elementChips');
  elementSet.forEach(el => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = el;
    chip.dataset.value = el;
    chip.onclick = () => {
      if (state.elementFilter.has(el)) state.elementFilter.delete(el);
      else state.elementFilter.add(el);
      render();
    };
    elementChips.appendChild(chip);
  });

  const talentSet = [...new Set(allCards.map(c => c.talent).filter(Boolean))].sort();
  const talentChips = document.getElementById('talentChips');
  talentSet.forEach(t => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = t;
    chip.dataset.value = t;
    chip.onclick = () => {
      if (state.talentFilter.has(t)) state.talentFilter.delete(t);
      else state.talentFilter.add(t);
      render();
    };
    talentChips.appendChild(chip);
  });
}

function renderSeriesChecklist() {
  const list = document.getElementById('seriesChecklist');
  const chipsBox = document.getElementById('seriesChips');
  list.innerHTML = '';

  const term = seriesSearchTerm.trim().toLowerCase();
  const visible = term ? allSeries.filter(s => s.toLowerCase().includes(term)) : allSeries;

  visible.forEach(s => {
    const checked = state.seriesFilter.has(s);
    const row = document.createElement('label');
    row.className = 'series-row' + (checked ? ' checked' : '');
    row.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''}> ${s} <span style="color:var(--text-faint);margin-left:auto;font-size:11px;">${seriesCounts[s] || 0}</span>`;
    row.querySelector('input').onchange = (e) => {
      if (e.target.checked) state.seriesFilter.add(s);
      else state.seriesFilter.delete(s);
      renderSeriesChecklist();
      render();
    };
    list.appendChild(row);
  });

  if (visible.length === 0) {
    list.innerHTML = '<div class="series-row" style="cursor:default;">No matches</div>';
  }

  chipsBox.innerHTML = [...state.seriesFilter].map(s => `
    <span class="series-chip">${s}<button data-series="${s}">✕</button></span>
  `).join('');
  chipsBox.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      state.seriesFilter.delete(btn.dataset.series);
      renderSeriesChecklist();
      render();
    };
  });
}

function getFiltered() {
  let list = allCards;

  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    list = list.filter(c => c.name.toLowerCase().includes(q) || c.series.toLowerCase().includes(q));
  }
  if (state.seriesFilter.size > 0) list = list.filter(c => state.seriesFilter.has(c.series));
  if (state.elementFilter.size > 0) list = list.filter(c => state.elementFilter.has(c.element));
  if (state.talentFilter.size > 0) list = list.filter(c => state.talentFilter.has(c.talent));
  if (state.iconicFilter === 'only') list = list.filter(c => c.is_iconic);
  if (state.iconicFilter === 'exclude') list = list.filter(c => !c.is_iconic);
  if (state.hasSkinsOnly) list = list.filter(c => skinsByCardId[c.id] && skinsByCardId[c.id].length > 0);

  list = list.slice().sort((a, b) =>
    state.sortOrder === 'za' ? b.name.localeCompare(a.name) : a.name.localeCompare(b.name)
  );

  return list;
}

function render() {
  document.querySelectorAll('#elementChips .chip').forEach(c => {
    c.classList.toggle('active', state.elementFilter.has(c.dataset.value));
  });
  document.querySelectorAll('#talentChips .chip').forEach(c => {
    c.classList.toggle('active', state.talentFilter.has(c.dataset.value));
  });
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === state.tab);
  });
  document.getElementById('shellRoot').classList.toggle('no-rail', state.tab !== 'all');

  if (state.tab === 'calculator') {
    document.getElementById('resultCount').textContent = '';
    renderCalculator();
    return;
  }

  if (state.tab === 'teams') {
    document.getElementById('resultCount').textContent = '';
    renderTeamsTab();
    return;
  }

  if (state.tab === 'guides') {
    document.getElementById('resultCount').textContent = '';
    renderGuides();
    return;
  }

  if (state.tab === 'wishlist') {
    document.getElementById('resultCount').textContent = '';
    renderWishlistTab();
    return;
  }

  if (state.tab === 'skins') {
    document.getElementById('resultCount').textContent = '';
    renderSkinsTab();
    return;
  }

  const filtered = getFiltered();
  document.getElementById('resultCount').textContent =
    filtered.length + ' of ' + allCards.length + ' cards';

  const content = document.getElementById('content');

  if (filtered.length === 0) {
    content.innerHTML = '<div class="empty-state"><h2>No cards match</h2><p>Try clearing a filter or adjusting your search.</p></div>';
    return;
  }

  content.innerHTML = '<div class="grid" id="grid"></div>';
  const grid = document.getElementById('grid');

  filtered.forEach(card => {
    const skinCount = (skinsByCardId[card.id] || []).length;
    const elColor = ELEMENT_COLORS[card.element] || 'var(--el-normal)';
    const cw = cardWishlistByCardId[card.id];
    const cwClass = cw && cw.obtained ? 'obtained' : (cw && cw.wanted ? 'wanted' : '');
    const cwSymbol = cw && cw.obtained ? '✓' : '♥';

    const tile = document.createElement('div');
    tile.className = 'card-tile';
    tile.innerHTML = `
      <div class="art-wrap">
        <img src="${card.image_url}" alt="${card.name}" loading="lazy">
        <button class="wishlist-heart card-heart ${cwClass}" title="${currentSession ? 'Click: want it. Click again: got it.' : 'Sign in to track'}">${cwSymbol}</button>
        ${card.is_iconic ? '<span class="iconic-badge">ICONIC</span>' : ''}
        <span class="element-badge" style="background:${elColor}">${card.element || ''}</span>
      </div>
      <div class="info">
        <p class="name">${card.name}</p>
        <p class="series">${card.series}</p>
        <p class="talent">${card.talent || ''}</p>
        ${skinCount > 0 ? `<span class="skin-count-badge">${skinCount} skin${skinCount > 1 ? 's' : ''}</span>` : ''}
      </div>
    `;
    tile.onclick = () => openModal(card);
    tile.querySelector('.card-heart').onclick = async (e) => {
      e.stopPropagation();
      const changed = await cycleCardWishlist(card.id);
      if (changed) render();
    };
    grid.appendChild(tile);
  });
}

function rarityClass(rarity) {
  if (!rarity) return 'event';
  if (rarity.includes('Mythical')) return 'mythical';
  if (rarity.includes('Legendary')) return 'legendary';
  return 'event';
}

function openModal(card) {

  const skins = (skinsByCardId[card.id] || []).slice().sort((a, b) => {
    const order = { 'Event Mythical': 0, 'Event Legendary': 1, 'Event': 2 };

  });

  const elColor = ELEMENT_COLORS[card.element] || 'var(--el-normal)';

  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
    <div class="modal-backdrop" id="backdrop">
      <div class="modal">
        <div class="modal-header">
          <div>
            <h2>${card.name}</h2>
            <p class="sub">${card.series}</p>

              ${card.is_iconic ? '<span class="tag" style="background:var(--gold);color:#1a1610;">Iconic</span>' : ''}

  document.getElementById('backdrop').onclick = (e) => {
    if (e.target.id === 'backdrop') closeModal();
  };

  document.getElementById('mainCardImg').onclick = () => openLightbox(card.image_url, card.name);

/* ---------------- Cost Calculator ---------------- */

function gradeTierOrder(grade) {
  const g = gradeTiers.find(gt => gt.grade === grade);
  return g ? g.tier_order : 1;
}

function computeStageCost(startIdx, targetIdx) {
  if (targetIdx <= startIdx) return null;
  const relevant = buildStages.filter(s => s.stage_order > startIdx && s.stage_order <= targetIdx);
  const totals = { gold: 0, essence: 0, cores: 0, ethereal: 0, sacrifices: {} };
  relevant.forEach(s => {
    totals.gold += s.gold_cost;
    totals.essence += s.essence_amount;
    totals.cores += s.cores_cost;
    totals.ethereal += s.ethereal_cores_cost;
    if (s.sacrifice_rarity && s.sacrifice_count) {
      totals.sacrifices[s.sacrifice_rarity] = (totals.sacrifices[s.sacrifice_rarity] || 0) + s.sacrifice_count;
    }
  });
  return totals;
}

function computeGradeCost(startGrade, targetGrade) {
  const startTier = gradeTierOrder(startGrade);
  const targetTier = gradeTierOrder(targetGrade);
  const steps = targetTier - startTier;
  if (steps <= 0 || !regradeConfig) return null;
  return {
    steps,
    bestCaseCores: steps * regradeConfig.cost_cores,
    worstCaseCores: steps * regradeConfig.cost_cores * regradeConfig.pity_max
  };
}

function fmt(n) {
  return n.toLocaleString('en-US');
}

function renderCalculator() {

    `<option value="${g.grade}" ${g.grade === selected ? 'selected' : ''}>${g.grade}</option>`
  ).join('');

  content.innerHTML = `

          <select id="startGrade">${gradeOptions(calcState.startGrade)}</select>
        </div>
        <label class="calc-toggle">
          <input type="checkbox" id="includeAcquisition" ${calcState.includeAcquisition ? 'checked' : ''}>
          I don't own this card yet — estimate cost to acquire it
        </label>
      </div>

      <div class="calc-panel">
        <h3>Target</h3>
        <div class="calc-field">
          <label>Rarity / stage</label>
          <select id="targetMilestone">${milestoneOptions(calcState.targetMilestone)}</select>

          <input type="checkbox" id="includeAttunement" ${calcState.includeAttunement ? 'checked' : ''}>

    renderResults();
  };

  };
  document.getElementById('startGrade').onchange = (e) => {
    calcState.startGrade = e.target.value;
    renderResults();
  };
  document.getElementById('targetGrade').onchange = (e) => {
    calcState.targetGrade = e.target.value;
    renderResults();
  };
  document.getElementById('includeAttunement').onchange = (e) => {
    calcState.includeAttunement = e.target.checked;

  };
  document.getElementById('includeAcquisition').onchange = (e) => {

function renderResults() {
  const box = document.getElementById('calcResults');
  if (!box) return;

  const card = allCards.find(c => c.id === calcState.cardId);
  if (!card) {
    box.innerHTML = '<p class="calc-note">Pick a card above to calculate essence type and see costs.</p>';
    return;
  }

  const stageCost = computeStageCost(calcState.startMilestone, calcState.targetMilestone);
  const gradeCost = computeGradeCost(calcState.startGrade, calcState.targetGrade);

  if (!stageCost && !gradeCost && !calcState.includeAttunement) {
    box.innerHTML = '<p class="calc-note">Target is at or below the starting point — nothing to build.</p>';
    return;
  }

  let warnings = '';
  const targetCap = calcState.targetMilestone >= 2 ? rarityGradeCaps['Mythical'] : (calcState.targetMilestone === 1 ? rarityGradeCaps['Legendary'] : rarityGradeCaps['Exotic']);
  if (targetCap && gradeTierOrder(calcState.targetGrade) > gradeTierOrder(targetCap.natural_max_grade) && calcState.targetGrade !== 'S+') {
    warnings += `<div class="calc-warning">Heads up: ${calcState.targetGrade} may be above what that rarity normally allows.</div>`;
  }

  let gold = stageCost ? stageCost.gold : 0;
  let essence = stageCost ? stageCost.essence : 0;
  let cores = stageCost ? stageCost.cores : 0;
  let ethereal = stageCost ? stageCost.ethereal : 0;

  if (calcState.includeAttunement && attunementConfig) {
    cores += attunementConfig.cores_cost * attunementConfig.pity_max;
    essence += attunementConfig.essence_amount * attunementConfig.pity_max;
  }

  const essenceLabel = card.element + ' Essence';

  let sacrificeHtml = '';
  if (stageCost && Object.keys(stageCost.sacrifices).length) {
    sacrificeHtml = `
      <p class="clabel" style="margin-top:16px;">Sacrifice cards needed</p>
      <div class="sacrifice-row">
        ${Object.entries(stageCost.sacrifices).map(([rarity, count]) =>
          `<span class="sacrifice-pill">${count} × ${rarity}</span>`
        ).join('')}
      </div>
    `;
  }

  let gradeHtml = '';
  if (gradeCost) {
    gradeHtml = `
      <p class="clabel" style="margin-top:16px;">Regrade (${calcState.startGrade} → ${calcState.targetGrade}, ${gradeCost.steps} tier${gradeCost.steps > 1 ? 's' : ''})</p>
      <div class="cost-grid" style="margin-top:8px;">
        <div class="cost-item">
          <div class="clabel">Best case (lucky)</div>
          <div class="cval">${fmt(gradeCost.bestCaseCores)} Cores</div>
        </div>
        <div class="cost-item">
          <div class="clabel">Worst case (full pity)</div>
          <div class="cval">${fmt(gradeCost.worstCaseCores)} Cores</div>
        </div>
      </div>
      <p class="calc-note">Regrade only moves the grade up one tier per success, with a shared 10-attempt pity that guarantees the next tier. Actual cost falls somewhere between these two.</p>
    `;
  }

  let acquisitionHtml = '';
  if (calcState.includeAcquisition) {
    const rarity = calcState.startMilestone === 0 ? 'Exotic' : (calcState.startMilestone === 1 ? 'Legendary' : null);
    if (!rarity) {
      acquisitionHtml = `<p class="calc-note" style="margin-top:16px;">Acquisition pricing is only available when starting from Exotic or Legendary — not enough community data yet for Mythical+.</p>`;
    } else {
      const est = getAcquisitionEstimate(rarity, card.is_iconic, calcState.startGrade);
      if (est) {
        cores += est.max; // fold the worst case into the running Cores total
        acquisitionHtml = `
          <p class="clabel" style="margin-top:16px;">Estimated acquisition cost (${rarity}${card.is_iconic ? ', Iconic' : ''}, ${calcState.startGrade} grade)</p>
          <div class="cost-grid" style="margin-top:8px;">
            <div class="cost-item">
              <div class="clabel">Typical price</div>
              <div class="cval">${est.min === est.max ? fmt(est.min) : fmt(est.min) + '–' + fmt(est.max)} Cores</div>
            </div>
          </div>
          <p class="calc-note">Based on typical trading prices, not a fixed game cost — actual prices vary by demand.${est.gradeDataMissing ? ' No pricing data yet for ' + calcState.startGrade + ' grade, so this shows the base rarity price only.' : ''} The Cores total above includes the high end of this estimate.</p>
        `;
      }
    }
  }

  box.innerHTML = `
    <h3>Total to build</h3>
    ${warnings}
    <div class="cost-grid">
      <div class="cost-item"><div class="clabel">Gold</div><div class="cval">${fmt(gold)}</div></div>
      <div class="cost-item"><div class="clabel">${essenceLabel}</div><div class="cval">${fmt(essence)}</div></div>
      <div class="cost-item"><div class="clabel">Cores</div><div class="cval">${fmt(cores)}</div></div>
      <div class="cost-item"><div class="clabel">Ethereal Cores</div><div class="cval">${fmt(ethereal)}</div></div>
      ${calcState.includeAttunement && attunementConfig ? `<div class="cost-item"><div class="clabel">Attunement Material</div><div class="cval">${fmt(attunementConfig.attunement_material_cost * attunementConfig.pity_max)}</div></div>` : ''}
    </div>
    ${sacrificeHtml}
    ${gradeHtml}
    ${acquisitionHtml}
    ${calcState.includeAttunement ? '<p class="calc-note">Attunement cost shown assumes going to full pity (10 attempts) to guarantee a Divine result, per your own account of how it works.</p>' : ''}
  `;
}

async function loadTeams() {

  const { data, error } = await sb.from('user_teams')
    .select('*').eq('user_id', currentSession.user.id).order('created_at');
  if (error) { console.error(error); return; }
  userTeams = data || [];
}

  const content = document.getElementById('content');

  if (!currentSession) {

    renderTeamBuilder();

    row.querySelectorAll('.team-thumb-item img').forEach(img => {

  });

  });

  document.getElementById('grabWishlistBtn').onclick = () => {
    const relevantCardIds = Object.keys(cardWishlistByCardId);
    const alreadyInTeam = new Set(teamBuilder.slots.map(s => s.cardId));
    relevantCardIds.forEach(cardId => {
      if (teamBuilder.slots.length >= MAX_TEAM_SIZE) return;
      if (alreadyInTeam.has(cardId)) return;
      if (!allCards.find(c => c.id === cardId)) return;
      teamBuilder.slots.push({ cardId, milestone: UNOBTAINED, ethereal: false, divineAttunement: '', skinId: null, ability: '', attunementPity: 0 });

    });

    teamSearch = '';

    render();

  renderMiniGrid();
  renderSlots();
  renderSlotDetails();
  renderTeamCost();

function renderMiniGrid() {
  const miniGrid = document.getElementById('miniGrid');
  if (!miniGrid) return;
  miniGrid.innerHTML = '';

  let filteredCards = teamSearch.trim()
    ? allCards.filter(c => c.name.toLowerCase().includes(teamSearch.trim().toLowerCase()))
    : allCards;

  if (teamPickerWishlistOnly) {
    filteredCards = filteredCards.filter(c => cardWishlistByCardId[c.id]);
  }

  const slotCardIds = teamBuilder.slots.map(s => s.cardId);

  filteredCards.slice(0, 200).forEach(card => {
    const inTeam = slotCardIds.includes(card.id);
    const atMax = teamBuilder.slots.length >= MAX_TEAM_SIZE;
    const el = document.createElement('div');
    el.className = 'mini-card' + (inTeam ? ' in-team' : '') + (!inTeam && atMax ? ' disabled' : '');
    el.innerHTML = `<img src="${card.image_url}" alt="${card.name}" loading="lazy"><div class="mname">${card.name}</div>`;
    el.onclick = () => {
      if (inTeam) {
        teamBuilder.slots = teamBuilder.slots.filter(s => s.cardId !== card.id);
      } else if (!atMax) {
        teamBuilder.slots.push({ cardId: card.id, milestone: UNOBTAINED, ethereal: false, divineAttunement: '', skinId: null, ability: '', attunementPity: 0 });
      } else {
        return;
      }
      renderMiniGrid();
      renderSlots();
      renderSlotDetails();
      renderTeamCost();
    };
    miniGrid.appendChild(el);
  });
}

function milestoneOptionsHtml(selected) {
  const unobtained = `<option value="${UNOBTAINED}" ${selected === UNOBTAINED ? 'selected' : ''}>Unobtained</option>`;
  return unobtained + MILESTONES.map(m =>
    `<option value="${m.idx}" ${m.idx === selected ? 'selected' : ''}>${m.shortLabel}</option>`
  ).join('');
}

function renderSlots() {
  const fillSlots = (containerId, startIdx, endIdx) => {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = '';
    for (let i = startIdx; i < endIdx; i++) {
      const slotData = teamBuilder.slots[i];
      const card = slotData ? allCards.find(c => c.id === slotData.cardId) : null;
      const slot = document.createElement('div');
      slot.className = card ? 'slot' : 'slot empty';
      if (card) {
        const displaySkin = slotData.skinId ? allSkins.find(sk => sk.skin_id === slotData.skinId) : null;
        const imgUrl = displaySkin ? displaySkin.image_url : card.image_url;
        slot.innerHTML = `
          <img src="${imgUrl}" alt="${card.name}" loading="lazy" style="cursor:pointer;">
          <button class="slot-remove" data-id="${card.id}">✕</button>
          <div class="slot-name">${card.name}</div>
          <select class="slot-milestone">${milestoneOptionsHtml(slotData.milestone)}</select>
          <div class="slot-talent">${card.talent || ''}</div>
        `;
        slot.querySelector('img').onclick = () => openModal(card);
        slot.querySelector('.slot-remove').onclick = () => {
          teamBuilder.slots = teamBuilder.slots.filter(s => s.cardId !== card.id);
          renderMiniGrid();
          renderSlots();
          renderSlotDetails();
          renderTeamCost();
        };
        slot.querySelector('.slot-milestone').onchange = (e) => {
          slotData.milestone = parseInt(e.target.value, 10);
          renderTeamCost();
        };
      } else {
        slot.innerHTML = '<span class="empty-slot">+</span>';
      }
      el.appendChild(slot);
    }
  };

  fillSlots('teamSlotsMain', 0, STARTING_FIVE);
  fillSlots('teamSlotsBench', STARTING_FIVE, MAX_TEAM_SIZE);
}

function renderSlotDetails() {
  const box = document.getElementById('slotDetailsSection');
  if (!box) return;

  const filled = teamBuilder.slots.filter(s => allCards.find(c => c.id === s.cardId));
  if (filled.length === 0) {
    box.innerHTML = '';
    return;

              ? `<select class="sdr-ability">

    row.querySelector('.sdr-ethereal input').onchange = (e) => {
      slotData.ethereal = e.target.checked;
    };
    row.querySelector('.sdr-divine').addEventListener('input', (e) => {
      slotData.divineAttunement = e.target.value;
      renderTeamCost();
    });
    const abilitySelect = row.querySelector('.sdr-ability');
    if (abilitySelect) {
      abilitySelect.onchange = (e) => {
        slotData.ability = e.target.value;
      };
    }
    row.querySelector('.sdr-pity-input').addEventListener('input', (e) => {
      let v = parseInt(e.target.value, 10);
      if (isNaN(v)) v = 0;
      slotData.attunementPity = Math.max(0, Math.min(10, v));
      renderTeamCost();
    });
    const skinSelect = row.querySelector('.sdr-skin');
    if (skinSelect) {
      skinSelect.onchange = (e) => {
        slotData.skinId = e.target.value || null;
        renderSlots();
      };
    }
  });
}

const FULLY_BUILT_MILESTONE = MILESTONES.length - 1; // Overdrive

// Sums the cost to take every filled team slot from its current milestone up to
// fully Overdriven, plus the cost to guarantee a Divine Attunement for any card
// that doesn't already have one recorded — grouping essence by element (since a
// team can mix elements) and sacrifice-card counts by rarity.
function computeTeamCost(slots) {
  const perCard = [];
  const totals = { gold: 0, cores: 0, ethereal: 0, attunementMaterial: 0, essenceByElement: {}, sacrifices: {} };

  slots.forEach(s => {
    const card = allCards.find(c => c.id === s.cardId);
    if (!card) return;

    // Unobtained still needs the full Exotic->Overdrive build path (computeStageCost treats
    // -1 the same as 0 here, since no stage has stage_order <= 0) — plus the one-time cost
    // to acquire a base Exotic copy in the first place.
    const buildCost = computeStageCost(s.milestone, FULLY_BUILT_MILESTONE);
    const acquisitionCost = s.milestone === UNOBTAINED ? getAcquisitionEstimate('Exotic', card.is_iconic, 'D') : null;

    const needsAttunement = !s.divineAttunement;
    const remainingAttempts = needsAttunement && attunementConfig
      ? Math.max(0, attunementConfig.pity_max - (s.attunementPity || 0))
      : 0;
    const attunementCost = (needsAttunement && attunementConfig && remainingAttempts > 0) ? {
      cores: attunementConfig.cores_cost * remainingAttempts,
      essence: attunementConfig.essence_amount * remainingAttempts,
      attunementMaterial: attunementConfig.attunement_material_cost * remainingAttempts
    } : null;

    perCard.push({ card, milestone: s.milestone, divineAttunement: s.divineAttunement, buildCost, attunementCost, acquisitionCost });

    if (buildCost) {
      totals.gold += buildCost.gold;
      totals.cores += buildCost.cores;
      totals.ethereal += buildCost.ethereal;
      totals.essenceByElement[card.element] = (totals.essenceByElement[card.element] || 0) + buildCost.essence;
      Object.entries(buildCost.sacrifices).forEach(([rarity, count]) => {
        totals.sacrifices[rarity] = (totals.sacrifices[rarity] || 0) + count;
      });
    }
    if (acquisitionCost) {
      totals.cores += acquisitionCost.max;
    }
    if (attunementCost) {
      totals.cores += attunementCost.cores;
      totals.attunementMaterial += attunementCost.attunementMaterial;
      totals.essenceByElement[card.element] = (totals.essenceByElement[card.element] || 0) + attunementCost.essence;
    }
  });

  return { perCard, totals };
}

function renderTeamCost() {
  const box = document.getElementById('teamCostSection');
  if (!box) return;

  const filled = teamBuilder.slots.filter(s => allCards.find(c => c.id === s.cardId));
  if (filled.length === 0) {
    box.innerHTML = '';
    return;
  }

  const { perCard, totals } = computeTeamCost(filled);

  const perCardHtml = perCard.map(({ card, milestone, divineAttunement, buildCost, attunementCost, acquisitionCost }) => {
    const statusLabel = milestoneLabel(milestone) + (divineAttunement ? ` · ${divineAttunement}` : ' · Needs Attunement');

    const combinedGold = buildCost ? buildCost.gold : 0;
    const combinedEssence = (buildCost ? buildCost.essence : 0) + (attunementCost ? attunementCost.essence : 0);
    const combinedCores = (buildCost ? buildCost.cores : 0) + (attunementCost ? attunementCost.cores : 0) + (acquisitionCost ? acquisitionCost.max : 0);
    const combinedEthereal = buildCost ? buildCost.ethereal : 0;
    const combinedMaterial = attunementCost ? attunementCost.attunementMaterial : 0;

    const nothingLeft = !buildCost && !attunementCost && !acquisitionCost;

    const costLine = nothingLeft
      ? `<span class="tcr-cost tcr-done">Fully built & attuned ✓</span>`
      : `<span class="tcr-cost">${fmt(combinedGold)} Gold · ${fmt(combinedEssence)} ${card.element} Essence · ${fmt(combinedCores)} Cores${combinedEthereal ? ' · ' + fmt(combinedEthereal) + ' Ethereal' : ''}${combinedMaterial ? ' · ' + fmt(combinedMaterial) + ' Attunement Mat.' : ''}${acquisitionCost ? ' (incl. ~' + fmt(acquisitionCost.max) + ' Cores to acquire)' : ''}</span>`;

    return `
      <div class="team-cost-row">
        <span class="tcr-name">${card.name}</span>
        <span class="tcr-status">${statusLabel}</span>
        ${costLine}
      </div>
    `;
  }).join('');

  const essenceItems = Object.entries(totals.essenceByElement).map(([el, amt]) =>
    `<div class="cost-item"><div class="clabel">${el} Essence</div><div class="cval">${fmt(amt)}</div></div>`
  ).join('');

  const sacrificeHtml = Object.keys(totals.sacrifices).length ? `
    <p class="clabel" style="margin-top:14px;">Sacrifice cards needed (team total)</p>
    <div class="sacrifice-row">
      ${Object.entries(totals.sacrifices).map(([rarity, count]) => `<span class="sacrifice-pill">${count} × ${rarity}</span>`).join('')}
    </div>
  ` : '';

  box.innerHTML = `
    <p class="slots-label" style="margin-top:22px;">Remaining cost to fully build & attune</p>
    <div class="team-cost-list">${perCardHtml}</div>
    <p class="clabel" style="margin-top:16px;">Team total</p>
    <div class="cost-grid" style="margin-top:8px;">
      <div class="cost-item"><div class="clabel">Gold</div><div class="cval">${fmt(totals.gold)}</div></div>
      ${essenceItems}
      <div class="cost-item"><div class="clabel">Cores</div><div class="cval">${fmt(totals.cores)}</div></div>
      <div class="cost-item"><div class="clabel">Ethereal Cores</div><div class="cval">${fmt(totals.ethereal)}</div></div>
      ${totals.attunementMaterial ? `<div class="cost-item"><div class="clabel">Attunement Material</div><div class="cval">${fmt(totals.attunementMaterial)}</div></div>` : ''}
    </div>
    ${sacrificeHtml}
    <p class="calc-note" style="margin-top:10px;">Attunement cost assumes going to full pity (10 attempts) to guarantee a Divine result, and is only added for cards that don't yet have one recorded above.</p>
  `;
}

async function saveTeam() {
  const payload = {
    user_id: currentSession.user.id,
    name: teamBuilder.name.trim() || 'Unnamed Team',
    slots: teamBuilder.slots,
    updated_at: new Date().toISOString()
  };

  let error;
  if (teamBuilder.id) {
    ({ error } = await sb.from('user_teams').update(payload).eq('id', teamBuilder.id));
  } else {
    ({ error } = await sb.from('user_teams').insert(payload));
  }

  if (error) { console.error(error); return; }

  teamBuilder = null;
  teamSearch = '';
  teamPickerWishlistOnly = false;
  await loadTeams();
  render();
}

async function deleteTeam(teamId) {
  if (!confirm('Delete this team? This cannot be undone.')) return;
  const { error } = await sb.from('user_teams').delete().eq('id', teamId);
  if (error) { console.error(error); return; }
  await loadTeams();
  render();
}

/* ---------------- My Wishlist ---------------- */

/* ---------------- Skins Browser ---------------- */

const RARITY_ORDER = { 'Event': 0, 'Event Legendary': 1, 'Event Mythical': 2 };

let skinSeriesSearchTerm = '';

function skinCardElement(skin) {
  if (!skin.card_id) return null;
  const card = allCards.find(c => c.id === skin.card_id);
  return card ? card.element : null;
}

function getFilteredSkins() {
  let list = allSkins;
  if (skinBrowseState.search.trim()) {
    const q = skinBrowseState.search.trim().toLowerCase();
    list = list.filter(s =>
      s.skin_name.toLowerCase().includes(q) || s.character_name.toLowerCase().includes(q)
    );
  }
  if (skinBrowseState.event) list = list.filter(s => s.description === skinBrowseState.event);
  if (skinBrowseState.rarity) list = list.filter(s => s.rarity === skinBrowseState.rarity);
  if (skinBrowseState.unreleasedOnly) list = list.filter(s => !s.card_id);
  if (skinBrowseState.seriesFilter.size > 0) list = list.filter(s => skinBrowseState.seriesFilter.has(s.series));
  if (skinBrowseState.elementFilter.size > 0) list = list.filter(s => skinBrowseState.elementFilter.has(skinCardElement(s)));

  return list.slice().sort((a, b) => a.character_name.localeCompare(b.character_name));
}

function renderSkinsTab() {
  const content = document.getElementById('content');

  const events = [...new Set(allSkins.map(s => s.description).filter(Boolean))].sort();
  const rarities = [...new Set(allSkins.map(s => s.rarity).filter(Boolean))]
    .sort((a, b) => (RARITY_ORDER[a] ?? 9) - (RARITY_ORDER[b] ?? 9));

  content.innerHTML = `
    <div class="skins-toolbar">
      <input type="text" id="skinSearchInput" placeholder="Search skin or character…" value="${skinBrowseState.search}">
      <select id="skinEventSelect">
        <option value="">All Events</option>
        ${events.map(ev => `<option value="${ev}" ${ev === skinBrowseState.event ? 'selected' : ''}>${ev}</option>`).join('')}
      </select>
      <select id="skinRaritySelect">
        <option value="">All Rarities</option>
        ${rarities.map(r => `<option value="${r}" ${r === skinBrowseState.rarity ? 'selected' : ''}>${r}</option>`).join('')}
      </select>
      <label class="toggle-row" style="white-space:nowrap;">
        <input type="checkbox" id="skinUnreleasedOnly" ${skinBrowseState.unreleasedOnly ? 'checked' : ''}>
        Unreleased card only
      </label>
    </div>

    <div class="calc-shell" style="grid-template-columns: 240px 1fr; margin-bottom:20px;">
      <div class="calc-panel">
        <h3 style="margin-bottom:10px;">Series</h3>
        <input type="text" class="mini-search" id="skinSeriesSearchBox" placeholder="Find a series…">
        <div class="series-checklist" id="skinSeriesChecklist" style="max-height:160px;"></div>
        <div class="series-selected-chips" id="skinSeriesChips"></div>
      </div>
      <div class="calc-panel">
        <h3 style="margin-bottom:10px;">Element</h3>
        <div class="chip-row" id="skinElementChips"></div>
      </div>
    </div>

    <p class="count" id="skinResultCount" style="margin-bottom:14px;display:block;"></p>
    <div class="wish-grid" id="skinBrowseGrid"></div>
  `;

  document.getElementById('skinSearchInput').addEventListener('input', (e) => {
    skinBrowseState.search = e.target.value;
    renderSkinGrid();
  });
  document.getElementById('skinEventSelect').addEventListener('change', (e) => {
    skinBrowseState.event = e.target.value;
    renderSkinGrid();
  });
  document.getElementById('skinRaritySelect').addEventListener('change', (e) => {
    skinBrowseState.rarity = e.target.value;
    renderSkinGrid();
  });
  document.getElementById('skinUnreleasedOnly').addEventListener('change', (e) => {
    skinBrowseState.unreleasedOnly = e.target.checked;
    renderSkinGrid();
  });
  document.getElementById('skinSeriesSearchBox').addEventListener('input', (e) => {
    skinSeriesSearchTerm = e.target.value;
    renderSkinSeriesChecklist();
  });

  renderSkinSeriesChecklist();
  renderSkinElementChips();
  renderSkinGrid();
}

function renderSkinSeriesChecklist() {
  const list = document.getElementById('skinSeriesChecklist');
  const chipsBox = document.getElementById('skinSeriesChips');
  if (!list) return;
  list.innerHTML = '';

  const allSkinSeries = [...new Set(allSkins.map(s => s.series))].sort();
  const skinSeriesCounts = {};
  allSkins.forEach(s => { skinSeriesCounts[s.series] = (skinSeriesCounts[s.series] || 0) + 1; });

  const term = skinSeriesSearchTerm.trim().toLowerCase();
  const visible = term ? allSkinSeries.filter(s => s.toLowerCase().includes(term)) : allSkinSeries;

  visible.forEach(s => {
    const checked = skinBrowseState.seriesFilter.has(s);
    const row = document.createElement('label');
    row.className = 'series-row' + (checked ? ' checked' : '');
    row.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''}> ${s} <span style="color:var(--text-faint);margin-left:auto;font-size:11px;">${skinSeriesCounts[s] || 0}</span>`;
    row.querySelector('input').onchange = (e) => {
      if (e.target.checked) skinBrowseState.seriesFilter.add(s);
      else skinBrowseState.seriesFilter.delete(s);
      renderSkinSeriesChecklist();
      renderSkinGrid();
    };
    list.appendChild(row);
  });

  if (visible.length === 0) {
    list.innerHTML = '<div class="series-row" style="cursor:default;">No matches</div>';
  }

  chipsBox.innerHTML = [...skinBrowseState.seriesFilter].map(s => `
    <span class="series-chip">${s}<button data-series="${s}">✕</button></span>
  `).join('');
  chipsBox.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      skinBrowseState.seriesFilter.delete(btn.dataset.series);
      renderSkinSeriesChecklist();
      renderSkinGrid();
    };
  });
}

function renderSkinElementChips() {
  const box = document.getElementById('skinElementChips');
  if (!box) return;
  box.innerHTML = '';

  const elementSet = [...new Set(allCards.map(c => c.element).filter(Boolean))].sort();
  elementSet.forEach(el => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (skinBrowseState.elementFilter.has(el) ? ' active' : '');
    chip.textContent = el;
    chip.onclick = () => {
      if (skinBrowseState.elementFilter.has(el)) skinBrowseState.elementFilter.delete(el);
      else skinBrowseState.elementFilter.add(el);
      renderSkinElementChips();
      renderSkinGrid();
    };
    box.appendChild(chip);
  });
}

function renderSkinGrid() {
  const list = getFilteredSkins();
  document.getElementById('skinResultCount').textContent = `${list.length} of ${allSkins.length} skins`;

  const grid = document.getElementById('skinBrowseGrid');
  if (!grid) return;

  if (list.length === 0) {
    grid.outerHTML = '<div class="empty-state" id="skinBrowseGrid"><h2>No skins match</h2><p>Try a different filter.</p></div>';
    return;
  }

  grid.className = 'wish-grid';
  grid.innerHTML = '';

  list.forEach(skin => {
    const card = skin.card_id ? allCards.find(c => c.id === skin.card_id) : null;
    const w = wishlistBySkinId[skin.skin_id];
    const heartClass = w && w.obtained ? 'obtained' : (w && w.wanted ? 'wanted' : '');
    const heartSymbol = w && w.obtained ? '✓' : '♥';

    const item = document.createElement('div');
    item.className = 'wish-item ' + rarityClass(skin.rarity);
    item.innerHTML = `
      <button class="wishlist-heart ${heartClass}" title="${currentSession ? 'Click: want it. Click again: got it.' : 'Sign in to track'}">${heartSymbol}</button>
      <img src="${skin.image_url}" alt="${skin.skin_name}" loading="lazy" style="cursor:zoom-in;">
      ${card
        ? `<button class="wcard-link">${card.name}</button>`
        : `<div class="wcard">${skin.character_name}</div>`
      }
      <div class="wname">${skin.skin_name}</div>
      <span class="rarity-pill ${rarityClass(skin.rarity)}">${skin.rarity}</span>
    `;

    item.querySelector('img').onclick = () => openLightbox(skin.image_url, skin.skin_name);
    item.querySelector('.wishlist-heart').onclick = async (e) => {
      e.stopPropagation();
      await cycleWishlist(skin.skin_id);
      renderSkinGrid();
    };
    const cardLink = item.querySelector('.wcard-link');
    if (cardLink) cardLink.onclick = () => openModal(card);

    grid.appendChild(item);
  });
}

function renderWishlistTab() {
  const content = document.getElementById('content');

  if (!currentSession) {
    content.innerHTML = `
      <div class="empty-state">
        <h2>Sign in to see your wishlist</h2>
        <p>Heart cards or skins and they'll show up here.</p>
      </div>
    `;
    return;
  }

  const cardEntries = Object.entries(cardWishlistByCardId)
    .map(([cardId, row]) => {
      const card = allCards.find(c => c.id === cardId);
      if (!card) return null;
      return { row, card };
    })
    .filter(Boolean);

  const skinEntries = Object.values(wishlistBySkinId)
    .map(row => {
      const skin = allSkins.find(s => s.skin_id === row.skin_id);
      if (!skin) return null;
      const card = skin.card_id ? allCards.find(c => c.id === skin.card_id) : null;
      return { row, skin, card };
    })
    .filter(Boolean);

  if (cardEntries.length === 0 && skinEntries.length === 0) {
    content.innerHTML = `
      <div class="empty-state">
        <h2>Nothing hearted yet</h2>
        <p>Heart a card's standard art if you prefer it plain, or heart a skin from any card's detail view — either way, it'll show up here.</p>
      </div>
    `;
    return;
  }

  const renderCardGroup = (title, list) => {
    if (list.length === 0) return '';
    return `
      <p class="wish-section-title">${title} (${list.length})</p>
      <div class="wish-grid">
        ${list.map(({ row, card }) => `
          <div class="wish-item">
            <img src="${card.image_url}" alt="${card.name}">
            <div class="wcard">${card.series}</div>
            <div class="wname">${card.name}</div>
            <div class="wish-actions">
              ${row.obtained
                ? `<button class="wish-btn" data-kind="card" data-action="unobtain" data-id="${card.id}">Mark wanted</button>`
                : `<button class="wish-btn" data-kind="card" data-action="obtain" data-id="${card.id}">Got it</button>`
              }
              <button class="wish-btn danger" data-kind="card" data-action="remove" data-id="${card.id}">Remove</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  };

  const renderSkinGroup = (title, list) => {
    if (list.length === 0) return '';
    return `
      <p class="wish-section-title">${title} (${list.length})</p>
      <div class="wish-grid">
        ${list.map(({ row, skin, card }) => `
          <div class="wish-item ${rarityClass(skin.rarity)}">
            <img src="${skin.image_url}" alt="${skin.skin_name}">
            <div class="wcard">${card ? card.name : skin.character_name}</div>
            <div class="wname">${skin.skin_name}</div>
            <div class="wish-actions">
              ${row.obtained
                ? `<button class="wish-btn" data-kind="skin" data-action="unobtain" data-id="${skin.skin_id}">Mark wanted</button>`
                : `<button class="wish-btn" data-kind="skin" data-action="obtain" data-id="${skin.skin_id}">Got it</button>`
              }
              <button class="wish-btn danger" data-kind="skin" data-action="remove" data-id="${skin.skin_id}">Remove</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  };

  content.innerHTML =
    renderCardGroup('Cards Wanted', cardEntries.filter(e => e.row.wanted && !e.row.obtained)) +
    renderCardGroup('Cards Obtained', cardEntries.filter(e => e.row.obtained)) +
    renderSkinGroup('Skins Wanted', skinEntries.filter(e => e.row.wanted && !e.row.obtained)) +
    renderSkinGroup('Skins Obtained', skinEntries.filter(e => e.row.obtained));

  content.querySelectorAll('.wish-btn').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      const kind = btn.dataset.kind;
      const table = kind === 'card' ? 'user_card_wishlist' : 'user_skin_wishlist';
      const idCol = kind === 'card' ? 'card_id' : 'skin_id';
      const store = kind === 'card' ? cardWishlistByCardId : wishlistBySkinId;

      if (action === 'remove') {
        await sb.from(table).delete().eq('user_id', currentSession.user.id).eq(idCol, id);
        delete store[id];
      } else if (action === 'obtain') {
        const { data } = await sb.from(table)
          .upsert({ user_id: currentSession.user.id, [idCol]: id, wanted: true, obtained: true, updated_at: new Date().toISOString() }, { onConflict: `user_id,${idCol}` })
          .select().single();
        store[id] = data;
      } else if (action === 'unobtain') {
        const { data } = await sb.from(table)
          .upsert({ user_id: currentSession.user.id, [idCol]: id, wanted: true, obtained: false, updated_at: new Date().toISOString() }, { onConflict: `user_id,${idCol}` })
          .select().single();
        store[id] = data;
      }
      renderWishlistTab();
    };
  });
}

function updateStickyHeaderHeight() {
  const stickyTop = document.querySelector('.sticky-top');
  if (!stickyTop) return;
  document.documentElement.style.setProperty('--sticky-h', stickyTop.offsetHeight + 'px');
}
window.addEventListener('resize', updateStickyHeaderHeight);

loadData().then(() => updateStickyHeaderHeight());
